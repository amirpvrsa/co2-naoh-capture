name: tests-and-build

on:
  push:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Build report
        run: python run.py
      - name: Upload report and tables
        uses: actions/upload-artifact@v4
        with:
          name: co2-naoh-capture-report
          path: |
            outputs/*.html
            outputs/*.csv
            outputs/*.json
            outputs/figures/
